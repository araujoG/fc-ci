# ============================================================
# SonarCloud Project Configuration
# ============================================================

# Unique identifier of the project on SonarCloud.
# Format: <organization-key>_<project-name>
# IMPORTANT: Replace with your actual organization key.
sonar.projectKey=araujog_ci-sonarcloud-challenge

# Display name on SonarCloud dashboard.
sonar.projectName=CI SonarCloud Challenge

# Version of the project.
sonar.projectVersion=1.0

# Organization key on SonarCloud.
# IMPORTANT: Replace with your actual organization key.
sonar.organization=araujog

# Source directory.
sonar.sources=src

# Test directory.
sonar.tests=tests

# Path to the LCOV coverage report generated by Jest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude node_modules and coverage folders from analysis.
sonar.exclusions=node_modules/**,coverage/**
